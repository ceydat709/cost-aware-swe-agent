[project]
name = "swe-agent-lite"
version = "0.1.0"
description = "A cost-aware coding agent evaluated on SWE-bench Lite"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "datasets>=2.20",
]

[project.optional-dependencies]
eval = ["swebench>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
swe-agent = "swe_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swe_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
